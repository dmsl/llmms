<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Service Unavailable — Maintenance in Progress</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    body {

        margin: 0;

        padding: 0;

        background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);

        font-family: "Segoe UI", Tahoma, sans-serif;

        color: #f8f9fa;

        display: flex;

        align-items: center;

        justify-content: center;

        height: 100vh;

        overflow: hidden;

        text-align: center;

    }



    .container {

        background: rgba(0, 0, 0, 0.25);

        padding: 40px 60px;

        border-radius: 16px;

        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);

        backdrop-filter: blur(12px);

        animation: fadein 1s ease;

    }



    @keyframes fadein {

        from { opacity: 0; transform: translateY(20px); }

        to { opacity: 1; transform: translateY(0); }

    }



    h1 {

        margin-bottom: 10px;

        font-size: 38px;

        font-weight: 600;

        letter-spacing: -1px;

    }



    p {

        font-size: 20px;

        line-height: 1.6;

        margin-top: 0;

        opacity: 0.9;

    }



    .spinner {

        margin: 30px auto;

        width: 70px;

        height: 70px;

        border: 7px solid rgba(255, 255, 255, 0.25);

        border-top-color: #ffffff;

        border-radius: 50%;

        animation: spin 1.2s linear infinite;

    }



    @keyframes spin {

        to { transform: rotate(360deg); }

    }



    .footer {

        margin-top: 25px;

        font-size: 14px;

        opacity: 0.6;

    }

</style>

</head>

<body>



<div class="container">

    <div class="spinner"></div>

    <h1>Service Unavailable</h1>

    <p>

        The system is currently running internal experiments<br>

        and is temporarily unavailable.<br>

        Please check back shortly.

    </p>

    <div class="footer">

        Thank you for your patience.

    </div>

</div>



</body>

</html>
