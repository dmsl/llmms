[package]
name = "browser_rag"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "IdbFactory",
  "IdbDatabase",
  "IdbObjectStore",
  "IdbTransaction",
  "IdbRequest",
  "IdbOpenDbRequest",
  "IdbVersionChangeEvent",
  "Event",
]
