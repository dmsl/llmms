<!DOCTYPE html>
<html>

<head>
    <title>Chat UCY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <!--important registration of jquery-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="static/css/chat.css?v=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>


<body class>



    <!-- Main Layout -->
    <div class="d-flex flex-row min-vh-100 min-vw-100 mw-100 mh-100" style="overflow: hidden;">



        <div id="leftside" class="d-flex flex-column flex-grow-1 expanded">
            <!-- Header -->
            <div class="py-4 px-4 d-flex align-items-center justify-content-between shadow-none w-100 "
                style="max-height: 10vh; height: 10vh; ">
                <!-- UCY Logo -->
                <div class="d-flex align-items-center " style="height: 6vh; max-height: 6vh;">
                    <img src="static/ucy_logo.png" class="img-fluid  p-2" alt="UCY Logo"
                        style="max-height: 100%; object-fit: contain;">
                    <img src="static/dmsllogobig.png" class="img-fluid  p-2" alt="DMSL Logo"
                        style="max-height: 100%; object-fit: contain; ">

                </div>
                <!-- Right Section of Header -->
                <div class="d-flex align-items-center " ">
                    <div class=" dropdown me-3 p-2">
                    <button class="btn btn-secondary dropdown-toggle selectmodel" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Select Model
                    </button>
                    <ul class="dropdown-menu">
                        <!-- Dynamic model list -->
                    </ul>
                </div>



                <!-- Sidebar Toggle Button for Larger Screens -->
                <!-- <button id="toggle-sidebar" class="btn btn-secondary p-2">
                    <i class="bi bi-layout-sidebar-inset-reverse"></i>
                </button> -->

                <!-- Sidebar Toggle Button for Mobile Devices -->
                <button id="toggle-sidebar" class="btn btn-secondary p-2">
                    <i class="fa fa-bars"></i>
                </button>


            </div>
        </div>
        <!-- Chat Area -->
        <div class="flex-grow-1 d-flex flex-column">
            <div id="content" class="d-flex flex-column flex-grow-1 ">
                <!-- Chat History -->
                <!-- <div id="chat-container" class="flex-grow-1  p-3">
                    <div id="chat-history" class="overflow-auto p-3" style="height: 65vh; max-height:65vh;"> -->
                <!-- Dynamic chat messages -->
                <div id="chat-container" class="flex-grow-1 d-flex flex-column p-3">
                    <div id="chat-history" class="flex-grow-1 overflow-auto p-3">


                    </div>

                    <!-- Input Area -->
                    <div class="p-1 ">
                        <!-- <div class="input-group"> -->

                        <!-- <div class="chat-input-container" style="max-height:15vh; height:15vh; overflow:hidden; "> -->
                        <div class="chat-input-container">

                            <!-- Attach Icon -->
                            <input type="file" id="file-input" class="d-none" accept=".pdf, .txt, image/*">

                            <!-- Upload Icon with Notification Bubble -->
                            <div class="position-relative">
                                <i id="upload-button" class="fa fa-paperclip chat-icon" title="Attach File"></i>
                                <span id="file-bubble"
                                    class="badge d-none position-absolute top-0 start-100 translate-middle p-1 bg-success rounded-circle"
                                    style="width: 0.8rem; height: 0.8rem; font-size: 0.6rem;">

                                    <!-- The bubble content -->
                                </span>
                            </div>


                            <textarea id="user-input" placeholder="Type your message here..." rows="3"></textarea>

                            <i id="websearch-button" class="fa fa-globe  chat-icon" title="Web Search"></i>

                            <!-- Send Button -->
                            <div class="send-button" id="send-button">
                                <i class="fa fa-arrow-up"></i>
                            </div>

                            <!-- <button id="websearch-button" class="btn " title="Toggle Web Search">
                                    <i class="fa fa-globe"></i>
                                </button> -->

                            <!-- <button id="upload-button" class="btn " title="Upload File">
                                    <i class="fa fa-upload"></i>
                                </button> -->

                            <!-- <input type="file" id="file-input" class="d-none">
                                <button id="send-button" class="btn btn-dark rounded-3" title="Send Message">
                                    <i class="fa fa-paper-plane"></i> -->
                            </button>
                        </div>
                        <!-- </div> -->
                    </div>


                </div>
            </div>
        </div>
    </div>






    <!-- Sidebar -->

    <div id="sidebar" class="vh-100 bg-secondary bg-opacity-10 d-flex flex-column  fixed-sidebar collapsed">
        <!-- Header Section -->
        <div class="p-3">
            <h2 class="h6 mb-0">Sessions</h2>
        </div>

        <!-- Scrollable Session List -->
        <div id="session-list" class="flex-grow-1 p-3 overflow-auto">
            <!-- Dynamic session list -->
        </div>

        <!-- Fixed New Chat Button -->
        <!-- Fixed New Chat Button at Bottom -->
        <div class="p-3" style="bottom: 0;">
            <button id="new-chat" class="btn btn-dark w-100" style="bottom: 0px;">
                <i class="fa fa-plus me-2"></i> New Chat
            </button>
        </div>
        <!-- </div> -->

    </div>




    </div>

    <!-- Bootstrap JS -->
    <!-- {% for js_file in js_files %}
    <script src="static/{{ js_file }}"></script>
    {% endfor %} -->

    <script src="static/js/script.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Include marked.js from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


</body>




</html>
