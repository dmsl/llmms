<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chat UCY{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    {% block content %}{% endblock %}

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Contact Section -->
            <div>
                <h4 class="fw-bold mb-3">Contact</h4>
                <p class="mb-1">
                    <i class="fa fa-envelope me-2"></i>
                    <a href="mailto:dmsl@cs.ucy.ac.cy" class="text-white text-decoration-none">dmsl@cs.ucy.ac.cy</a>
                </p>
                <p>
                    <i class="fa fa-phone me-2"></i>
                    <a href="tel:+35722892755" class="text-white text-decoration-none">+357-22-892755</a>
                </p>
            </div>

            <!-- Legal Section -->
            <div class="text-end">
                <h4 class="fw-bold mb-3">Legal</h4>
                <p>
                    <a href="{{ url_for('terms') }}" class="text-white text-decoration-none">Terms of Service</a> |
                    <a href="{{ url_for('privacy') }}" class="text-white text-decoration-none">Privacy Policy</a>
                </p>
                <p class="mb-0">© 2024 ChatUCY. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
