# ── Playwright MCP + noVNC Apache proxy ──────────────────────────────────────
# Add inside your existing SSL VirtualHost in:
#   /etc/apache2/sites-enabled/chatucy-mcp.conf  (or whichever conf is active)
#
# Exposes:
#   https://chatucy.cs.ucy.ac.cy/mcp/playwright     ← AI agent MCP endpoint (SSE)
#   https://chatucy.cs.ucy.ac.cy/browser-view/       ← noVNC live browser view
# ─────────────────────────────────────────────────────────────────────────────

<IfModule mod_proxy.c>

    # ── Playwright MCP — SSE (HTTP) transport ─────────────────────────────────
    # The MCP server speaks SSE over plain HTTP on /sse
    # Apache must NOT buffer the streamed response.
    <Location /mcp/playwright>
        ProxyPass         http://127.0.0.1:3001/
        ProxyPassReverse  http://127.0.0.1:3001/
        # Disable buffering so SSE events reach the client immediately
        SetEnv proxy-sendchunks       1
        SetEnv proxy-initial-not-pooled 1
        ProxyTimeout 3600
    </Location>

    # ── noVNC static assets ───────────────────────────────────────────────────
    <Location /browser-view>
        ProxyPass         http://127.0.0.1:6080/
        ProxyPassReverse  http://127.0.0.1:6080/
    </Location>

    # ── noVNC WebSocket (websockify) ──────────────────────────────────────────
    <IfModule mod_proxy_wstunnel.c>
        <Location /browser-view/websockify>
            ProxyPass        ws://127.0.0.1:6080/websockify
            ProxyPassReverse ws://127.0.0.1:6080/websockify
        </Location>
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule ^/browser-view/websockify(.*)$ ws://127.0.0.1:6080/websockify$1 [P,L]
    </IfModule>

    ProxyRequests    Off
    ProxyPreserveHost On
</IfModule>

# ── Required modules (enable once) ───────────────────────────────────────────
# sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
# sudo systemctl reload apache2
