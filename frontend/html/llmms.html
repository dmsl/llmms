<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat UCY - LLM Meta Search</title>
    
    <!-- Alpine.js for reactivity (15KB) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Tailwind CSS via CDN (production: use built version) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind configuration with your color palette
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#6a42c2',
                            light: '#8b6dd4',
                            dark: '#4a2c82',
                            pale: '#f2f0f6'
                        },
                        sidebar: {
                            DEFAULT: '#f2f0f6',
                            border: 'rgba(106, 66, 194, 0.2)'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom minimal CSS -->
    <style>
        /* Smooth scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(106, 66, 194, 0.3);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(106, 66, 194, 0.5);
        }
        
        /* Hide scrollbar but keep functionality */
        .scrollbar-hidden::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hidden {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }
    </style>
</head>

<body class="h-screen overflow-hidden bg-white font-sans antialiased" x-data="chatApp()">
    <!-- Mobile Overlay -->
    <div 
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        x-transition:enter="transition ease-out duration-200"
        x-transition:leave="transition ease-in duration-200"
        class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden">
    </div>
    
    <!-- Main Container -->
    <div class="flex h-full">
        <!-- Sidebar -->
        <aside 
            :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
            class="fixed lg:static inset-y-0 left-0 z-40 w-72 lg:w-64 bg-primary-pale border-r border-sidebar-border transform transition-transform duration-300 ease-in-out flex flex-col">
            
            <!-- Sidebar Header with Close Button on Mobile -->
            <div class="p-4 border-b border-sidebar-border flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-800">Sessions</h2>
                <button 
                    @click="sidebarOpen = false"
                    class="lg:hidden text-primary hover:bg-primary-light rounded-lg p-2 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <!-- Session List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                <template x-for="session in sessions" :key="session.id">
                    <button 
                        @click="selectSession(session.id)"
                        :class="currentSession === session.id ? 'bg-primary text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
                        class="w-full text-left px-4 py-3 rounded-lg shadow-sm transition-all duration-200">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium truncate" x-text="session.name"></span>
                            <i class="fas fa-comment-dots text-xs opacity-60"></i>
                        </div>
                    </button>
                </template>
                
                <!-- Empty state -->
                <div x-show="sessions.length === 0" class="text-center py-8 text-gray-500">
                    <i class="fas fa-comments text-3xl mb-2"></i>
                    <p class="text-sm">No sessions yet</p>
                </div>
            </div>
            
            <!-- Sidebar Footer -->
            <div class="p-3 border-t border-sidebar-border space-y-2">
                <button 
                    @click="newChat()"
                    class="w-full bg-gray-800 hover:bg-gray-900 text-white px-4 py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span>New Chat</span>
                </button>
                <button 
                    @click="clearAllSessions()"
                    class="w-full bg-transparent hover:bg-gray-100 text-gray-700 border border-gray-300 px-4 py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-trash"></i>
                    <span>Clear All</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full relative">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm">
                <!-- Left: Menu Toggle -->
                <button 
                    @click="sidebarOpen = !sidebarOpen"
                    :class="sidebarOpen ? 'bg-primary text-white' : 'bg-primary-pale text-primary hover:bg-primary-light'"
                    class="lg:hidden w-10 h-10 rounded-lg transition-all duration-200 flex items-center justify-center font-bold text-lg">
                    <i :class="sidebarOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
                </button>
                
                <!-- Center: Title (optional) -->
                <div class="flex-1 lg:ml-0 ml-4">
                    <h1 class="text-lg font-semibold text-gray-800 hidden sm:block">LLM Meta Search</h1>
                </div>
                
                <!-- Right: Logos & Menu -->
                <div class="flex items-center gap-3">
                    <a href="https://www.ucy.ac.cy/" target="_blank" class="h-8 hidden sm:block hover:opacity-75 transition-opacity" title="UCY">
                        <img src="/img/ucy_logo.png" alt="UCY" class="h-full object-contain" onerror="this.style.display='none'">
                    </a>
                    <a href="https://dmsl.cs.ucy.ac.cy" target="_blank" class="h-8 hidden sm:block hover:opacity-75 transition-opacity" title="DMSL">
                        <img src="/img/dmsllogobig.png" alt="DMSL" class="h-full object-contain" onerror="this.style.display='none'">
                    </a>
                    
                    <!-- Navigation Dropdown -->
                    <div class="relative" x-data="{ open: false }">
                        <button 
                            @click="open = !open"
                            class="p-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors flex items-center justify-center" title="Menu">
                            <img src="/img/chatucy_logo.png" alt="ChatUCY" class="h-6 object-contain" onerror="this.innerHTML='☰'">
                        </button>
                        </button>
                        <div 
                            x-show="open"
                            @click.away="open = false"
                            x-transition
                            class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                            <div class="px-4 py-2 text-sm text-gray-500 border-b border-gray-200">v1.2</div>
                            <a href="/" class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="fas fa-home"></i> Home
                            </a>
                            <a href="/privacy" class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="fas fa-lock"></i> Privacy
                            </a>
                            <a href="/terms" class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="fas fa-file-text"></i> Terms
                            </a>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Chat Area -->
            <div class="flex-1 overflow-y-auto scrollbar-hidden px-4 py-6" id="chat-history">
                <div class="max-w-4xl mx-auto space-y-4 pb-32">
                    <template x-for="message in messages" :key="message.id">
                        <div 
                            :class="message.role === 'user' ? 'justify-end' : 'justify-start'"
                            class="flex">
                            <div 
                                :class="message.role === 'user' 
                                    ? 'bg-primary text-white rounded-tl-2xl rounded-tr-2xl rounded-bl-2xl' 
                                    : 'bg-gray-100 text-gray-800 rounded-tl-2xl rounded-tr-2xl rounded-br-2xl'"
                                class="max-w-[80%] px-4 py-3 shadow-sm">
                                <p class="text-sm whitespace-pre-wrap" x-html="message.content"></p>
                                <template x-if="message.model">
                                    <div class="text-xs opacity-70 mt-2" x-text="'Model: ' + message.model"></div>
                                </template>
                            </div>
                        </div>
                    </template>
                    
                    <!-- Loading indicator -->
                    <div x-show="isLoading" class="flex justify-start">
                        <div class="bg-gray-100 rounded-2xl px-4 py-3 shadow-sm">
                            <div class="flex gap-1">
                                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="absolute bottom-0 left-0 right-0 bg-primary-pale border-t border-sidebar-border p-4 shadow-lg backdrop-blur-sm">
                <div class="max-w-4xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-3">
                        <!-- Main Input Row -->
                        <div class="flex gap-2 items-end">
                            <textarea 
                                x-model="userInput"
                                @keydown.enter.prevent="handleEnter($event)"
                                placeholder="Type your message here..."
                                rows="1"
                                class="flex-1 resize-none border-none outline-none text-gray-800 text-sm max-h-32 overflow-y-auto scrollbar-hidden"
                                style="min-height: 2.5rem;"></textarea>
                            
                            <button 
                                @click="sendMessage()"
                                :disabled="!userInput.trim() || isLoading"
                                :class="userInput.trim() && !isLoading ? 'bg-primary hover:bg-primary-dark' : 'bg-gray-300 cursor-not-allowed'"
                                class="w-10 h-10 rounded-full text-white flex items-center justify-center transition-colors flex-shrink-0">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        
                        <!-- Bottom Controls -->
                        <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-200">
                            <!-- Model Selector -->
                            <div class="relative" x-data="{ open: false }">
                                <button 
                                    @click="open = !open"
                                    class="px-3 py-2 text-sm rounded-lg border border-primary text-primary hover:bg-primary-pale transition-colors flex items-center gap-2">
                                    <span x-text="selectedModel"></span>
                                    <i class="fas fa-chevron-down text-xs"></i>
                                </button>
                                <div 
                                    x-show="open"
                                    @click.away="open = false"
                                    x-transition
                                    class="absolute bottom-full mb-2 left-0 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50 min-w-[200px]">
                                    <div class="px-3 py-1 text-xs font-semibold text-gray-500">Meta LLM Selection</div>
                                    <button 
                                        @click="selectModel('LLM-MS-OUA'); open = false"
                                        class="w-full text-left px-3 py-2 text-sm hover:bg-gray-100 text-gray-700">
                                        LLM-MS-OUA
                                    </button>
                                    <button 
                                        @click="selectModel('LLM-MS-MAB'); open = false"
                                        class="w-full text-left px-3 py-2 text-sm hover:bg-gray-100 text-gray-700">
                                        LLM-MS-MAB
                                    </button>
                                </div>
                            </div>
                            
                            <!-- File Upload -->
                            <button 
                                @click="$refs.fileInput.click()"
                                class="w-10 h-10 rounded-lg border border-primary text-primary hover:bg-primary-pale transition-colors flex items-center justify-center">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <input type="file" x-ref="fileInput" @change="handleFileUpload($event)" class="hidden" accept=".pdf,.txt,image/*">
                            
                            <!-- LLM-MS Toggle -->
                            <div class="flex items-center gap-2 ml-auto">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input 
                                        type="checkbox"
                                        x-model="llmMsEnabled"
                                        class="w-4 h-4 text-primary rounded focus:ring-primary">
                                    <span class="text-sm text-gray-700">LLM-MS</span>
                                </label>
                                
                                <!-- Settings Button -->
                                <button 
                                    @click="settingsOpen = true"
                                    :class="llmMsEnabled ? 'text-green-600 bg-green-50' : 'text-gray-600 bg-gray-50'"
                                    class="w-10 h-10 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors flex items-center justify-center">
                                    <i class="fas fa-sliders"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Settings Modal -->
    <div 
        x-show="settingsOpen"
        @click.self="settingsOpen = false"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div 
            x-show="settingsOpen"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto custom-scrollbar">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h3 class="text-xl font-semibold text-gray-800">Advanced Settings</h3>
                <button @click="settingsOpen = false" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- Algorithm Type -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Algorithm Type</label>
                    <select x-model="config.algorithmType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="stepwise">OUA (Overperformers-Underperformers)</option>
                        <option value="mab">MAB (Multi-Armed Bandit)</option>
                    </select>
                </div>
                
                <!-- Token Budget -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Token Budget: <span class="text-primary font-semibold" x-text="config.maxTokens"></span>
                    </label>
                    <input 
                        type="range" 
                        x-model.number="config.maxTokens"
                        min="256" 
                        max="4096" 
                        step="128"
                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                </div>
                
                <!-- Alpha/Beta Weights -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Alpha (Question Sim): <span class="text-primary font-semibold" x-text="config.alpha.toFixed(2)"></span>
                        </label>
                        <input 
                            type="range" 
                            x-model.number="config.alpha"
                            min="0" 
                            max="1" 
                            step="0.05"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Beta (Consensus): <span class="text-primary font-semibold" x-text="config.beta.toFixed(2)"></span>
                        </label>
                        <input 
                            type="range" 
                            x-model.number="config.beta"
                            min="0" 
                            max="1" 
                            step="0.05"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                    </div>
                </div>
                
                <!-- Save Button -->
                <div class="pt-4 border-t border-gray-200">
                    <button 
                        @click="saveSettings(); settingsOpen = false"
                        class="w-full bg-primary hover:bg-primary-dark text-white py-3 rounded-lg font-medium transition-colors">
                        Save Settings
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Alpine.js Component -->
    <script>
        function chatApp() {
            return {
                sidebarOpen: false,
                settingsOpen: false,
                userInput: '',
                messages: [],
                sessions: [],
                currentSession: null,
                isLoading: false,
                selectedModel: 'LLM-MS-OUA',
                llmMsEnabled: true,
                config: {
                    algorithmType: 'stepwise',
                    maxTokens: 1024,
                    alpha: 0.7,
                    beta: 0.3,
                    dynamicMarginCoeff: 0.5
                },
                
                init() {
                    // Load from sessionStorage
                    const savedSessions = sessionStorage.getItem('sessions');
                    if (savedSessions) {
                        this.sessions = JSON.parse(savedSessions);
                    } else {
                        this.newChat();
                    }
                    
                    const savedConfig = sessionStorage.getItem('llmMsConfig');
                    if (savedConfig) {
                        this.config = { ...this.config, ...JSON.parse(savedConfig) };
                    }
                    
                    // Auto-resize textarea
                    this.$watch('userInput', () => {
                        const textarea = document.querySelector('textarea');
                        if (textarea) {
                            textarea.style.height = 'auto';
                            textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
                        }
                    });
                },
                
                newChat() {
                    const newSession = {
                        id: Date.now(),
                        name: `Chat ${this.sessions.length + 1}`,
                        messages: []
                    };
                    this.sessions.push(newSession);
                    this.currentSession = newSession.id;
                    this.messages = [];
                    this.saveSessions();
                },
                
                selectSession(sessionId) {
                    this.currentSession = sessionId;
                    const session = this.sessions.find(s => s.id === sessionId);
                    if (session) {
                        this.messages = session.messages;
                    }
                    this.sidebarOpen = false;
                },
                
                clearAllSessions() {
                    if (confirm('Are you sure you want to clear all sessions?')) {
                        this.sessions = [];
                        this.messages = [];
                        this.currentSession = null;
                        sessionStorage.removeItem('sessions');
                        this.newChat();
                    }
                },
                
                selectModel(model) {
                    this.selectedModel = model;
                    this.config.algorithmType = model === 'LLM-MS-OUA' ? 'stepwise' : 'mab';
                },
                
                handleEnter(event) {
                    if (!event.shiftKey) {
                        this.sendMessage();
                    }
                },
                
                async sendMessage() {
                    if (!this.userInput.trim() || this.isLoading) return;
                    
                    const userMessage = {
                        id: Date.now(),
                        role: 'user',
                        content: this.userInput.trim()
                    };
                    
                    this.messages.push(userMessage);
                    this.userInput = '';
                    this.isLoading = true;
                    
                    // Scroll to bottom
                    this.$nextTick(() => {
                        const chatHistory = document.getElementById('chat-history');
                        chatHistory.scrollTop = chatHistory.scrollHeight;
                    });
                    
                    try {
                        // Prepare API call
                        const endpoint = this.llmMsEnabled ? '/api/send_message_llmms' : '/api/send_message';
                        const payload = this.llmMsEnabled ? {
                            messages: this.messages.map(m => ({ role: m.role, content: m.content })),
                            algorithm_type: this.config.algorithmType,
                            config: {
                                MAX_TOKENS: this.config.maxTokens,
                                ALPHA: this.config.alpha,
                                BETA: this.config.beta,
                                DYNAMIC_MARGIN_COEFF: this.config.dynamicMarginCoeff,
                                MODELS: ['llama3.1', 'mistral', 'qwen2.5'],
                                EMBEDDING_MODEL: 'nomic-embed-text'
                            }
                        } : {
                            model: this.selectedModel,
                            messages: this.messages.map(m => ({ role: m.role, content: m.content }))
                        };
                        
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let assistantMessage = {
                            id: Date.now() + 1,
                            role: 'assistant',
                            content: '',
                            model: this.selectedModel
                        };
                        this.messages.push(assistantMessage);
                        
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n').filter(line => line.trim());
                            
                            for (const line of lines) {
                                try {
                                    if (this.llmMsEnabled) {
                                        const data = JSON.parse(line);
                                        if (data.status === 'final_result' && data.output) {
                                            assistantMessage.content = data.output;
                                            assistantMessage.model = data.model || this.selectedModel;
                                        } else if (data.status === 'model_progress' && data.partial_output) {
                                            assistantMessage.content = data.partial_output;
                                        }
                                    } else {
                                        assistantMessage.content += line;
                                    }
                                } catch (e) {
                                    if (!this.llmMsEnabled) {
                                        assistantMessage.content += line;
                                    }
                                }
                            }
                            
                            // Auto-scroll
                            this.$nextTick(() => {
                                const chatHistory = document.getElementById('chat-history');
                                chatHistory.scrollTop = chatHistory.scrollHeight;
                            });
                        }
                    } catch (error) {
                        console.error('Error sending message:', error);
                        this.messages.push({
                            id: Date.now() + 2,
                            role: 'assistant',
                            content: 'Error: Unable to get response. Please try again.'
                        });
                    } finally {
                        this.isLoading = false;
                        this.saveSessions();
                    }
                },
                
                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        console.log('File selected:', file.name);
                        // Implement file upload logic here
                    }
                },
                
                saveSettings() {
                    sessionStorage.setItem('llmMsConfig', JSON.stringify(this.config));
                },
                
                saveSessions() {
                    const session = this.sessions.find(s => s.id === this.currentSession);
                    if (session) {
                        session.messages = this.messages;
                    }
                    sessionStorage.setItem('sessions', JSON.stringify(this.sessions));
                }
            }
        }
    </script>
</body>
</html>
