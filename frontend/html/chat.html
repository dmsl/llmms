<!DOCTYPE html>
<html>

<head>
    <title>Chat UCY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/output.css">
    <link rel="stylesheet" href="/css/freelancer.css">
    <link rel="stylesheet" href="/css/sporthere.css">
    <link rel="stylesheet" href="/css/index.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/chat.css?v=1.0">
    <!-- Our responsive CSS -->
    <!-- <link rel="stylesheet" href="/css/responsive.css"> -->

    <!-- Add these scripts in the head section, before your main script.js is loaded -->
    <!-- TensorFlow.js Core and Universal Sentence Encoder -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>

    <!-- PDF.js for PDF parsing -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script> -->

    <!-- Mammoth.js for DOCX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.19/mammoth.browser.min.js"></script>



</head>

<body>
    <div class="relative flex h-full w-full flex-col overflow-hidden">
        <!-- Main container -->
        <div id="main-container" class="relative flex h-full w-full flex-row overflow-hidden">
            <!-- Sidebar (now on the left) -->
            <div id="sidebar" class="vh-screen bg-secondary bg-opacity-10 flex flex-col fixed-sidebar collapsed">
                <div class="p-3">
                    <h2 class="text-sm mb-0">Sessions</h2>
                </div>
                <div id="session-list" class="flex-grow p-3 overflow-auto">
                    <!-- Dynamic session list -->
                </div>
                <div class="p-3" style="bottom: 0;">
                    <button id="new-chat" class="btn btn-dark w-full">
                        <i class="fa fa-plus me-2"></i> New Chat
                    </button>
                    <button id="clear-all-chats" class="btn btn-dark w-full mt-1">
                        <i class=" fa fa-trash me-2"></i> Clear All Sessions
                    </button>
                </div>
            </div>
            <!-- End Sidebar -->

            <!-- Chat area (right side) -->
            <div id="rightside" class="relative flex h-full max-w-full flex-1 flex-col overflow-hidden">
                <!-- Header -->
                <div class="py-3 px-4 flex items-center justify-between shadow-none w-full header"
                    style="max-height: 10vh; height: 10vh;">
                    <!-- Move right buttons to the left -->
                    <div class="flex items-center">
                        <button id="toggle-sidebar" class="btn btn-secondary p-2">
                            <i class="fa fa-bars"></i>
                        </button>
                    </div>
                    <!-- Move logos to the right -->
                    <div class="flex items-center gap-2" style="height: 6vh; max-height: 6vh;">
                        <div class="h-full">
                            <a href="https://www.ucy.ac.cy/" target="_blank" class="block h-full">
                                <img src="/img/ucy_logo.png" class="img-fluid p-2" alt="UCY Logo"
                                    style="max-height: 100%; object-fit: contain;">
                            </a>
                        </div>
                        <div class="h-full">
                            <a href="https://dmsl.cs.ucy.ac.cy" target="_blank" class="block h-full">
                                <img src="/img/dmsllogobig.png" class="img-fluid p-2" alt="DMSL Logo"
                                    style="max-height: 100%; object-fit: contain;">
                            </a>
                        </div>

                        <!-- Navigation dropdown (moved to right side) -->
                        <div class="tw-dropdown ml-2 dropdown">
                            <button class="tw-btn tw-btn-outline p-2 rounded border border-gray-300 hover:bg-gray-100"
                                type="button" id="navLinks" data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="/img/chatucy_logo.png" alt="ChatUCY Logo" class="img-fluid"
                                    style="max-height: 30px; margin: 0 auto;">
                            </button>
                            <ul class="tw-dropdown-menu dropdown-menu dropdown-menu-end" aria-labelledby="navLinks">
                                <li class="px-1 py-1 text-center">
                                    <div class="d-flex align-items-center justify-content-center">

                                        <span class="ms-1" style="font-size: 0.8em;">v1.2</span>
                                    </div>
                                </li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item tw-dropdown-item px-3 py-2 hover:bg-gray-100 block"
                                        href="/index.html"><i class="fa fa-home me-2"></i>Home</a></li>
                                <li><a class="dropdown-item tw-dropdown-item px-3 py-2 hover:bg-gray-100 block"
                                        href="/privacy.html"><i class="fa fa-lock me-2"></i>Privacy</a></li>
                                <li><a class="dropdown-item tw-dropdown-item px-3 py-2 hover:bg-gray-100 block"
                                        href="/terms.html"><i class="fa fa-file-text me-2"></i>Terms</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <!-- End Header -->

                <!-- Chat Area -->

                <div id="content" class="flex flex-col flex-grow">
                    <div id="chat-container" class="flex flex-col flex-grow" style="position: relative;">
                        <!-- Chat History: take all remaining space -->
                        <div id="chat-history" class="flex-grow overflow-auto">
                            <!-- Dynamic chat messages -->
                        </div>

                        <!-- End Input Area -->
                    </div>
                    <!-- Input Area: directly inside chat-container -->
                    <div class="chat-input-container flex items-center space-x-2 fixed-bottom-bg">
                        <textarea id="user-input" placeholder="Type your message here..." rows="1"
                            class="flex-grow"></textarea>
                        <div id='misc'>
                            <div id='modeldropdown' class="dropdown ">
                                <button id='modelbutton' class="btn btn-secondary dropdown-toggle selectmodel"
                                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    Select Model
                                </button>
                                <ul id='modelmenu' class="dropdown-menu">
                                    <!-- Dynamic model list -->
                                </ul>
                            </div>
                            <input type="file" id="file-input" class="hidden" accept=".pdf, .txt, image/*" multiple>
                            <div class="relative">
                                <i id="upload-button" class="fa fa-paperclip chat-icon" title="Attach Files"
                                    aria-hidden="true"></i>
                                <span class="sr-only">Attach File</span>
                            </div>

                            <!-- Radio button for RAG instead of icon -->
                            <div class="relative d-flex align-items-center mx-2">
                                <input type="checkbox" id="rag-toggle" class="form-check-input me-1"
                                    title="Toggle Local RAG">
                                <label for="rag-toggle" class="form-check-label small text-muted">Local RAG</label>
                            </div>

                            <!-- Add file info container -->
                            <div id="file-info-container" class="d-none">
                                <span id="file-name" class="file-name d-flex align-items-center"></span>
                            </div>

                            <div class="send-button" id="send-button">
                                <i class="fa fa-arrow-up" aria-hidden="true"></i>
                            </div>
                        </div>

                        <!-- <i id="websearch-button" class="fa fa-globe chat-icon" title="Web Search" style="display: none;"
                            aria-hidden="true"></i>
                        <span class="sr-only">Web Search</span> -->


                    </div>
                </div>

                <!-- End Chat Area -->
            </div>
            <!-- End Chat Area (right side) -->
        </div>
        <!-- End Main container -->
    </div>

    <!-- jQuery and other libraries -->
    <!-- Import Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/jquery-1.11.0.js"></script>
    <script src="/js/bootstrap.bundle.js"></script>
    <script src="/js/jquery.easing.min.js"></script>

    <!-- Import PDF.js as a module and expose it globally -->
    <script type="module">
        // Import the display layer module from your local PDF.js build
        import * as pdfjsLib from "/js/browser-rag/pdf.mjs";
        // Set the worker source to your local PDF.js worker module
        pdfjsLib.GlobalWorkerOptions.workerSrc = "/js/browser-rag/pdf.worker.mjs";
        // Expose the PDF.js library to the global scope so that your non‑module scripts can use it
        window.pdfjsLib = pdfjsLib;
        console.log("Local PDF.js imported and attached to window.pdfjsLib");
    </script>

    <script src="/js/jquery.easing.min.js?v=1"></script>
    <script src="/js/classie.js?v=1"></script>
    <script src="/js/jqBootstrapValidation.js?v=1"></script>
    <script src="/js/contact_me.js?v=1"></script>
    <script src="/js/freelancer.js?v=1"></script>
    <script src="https://kit.fontawesome.com/502aa52b51.js" crossorigin="anonymous"></script>
    <!-- Load our document processing modules -->
    <script src="/js/script.js?v=1"></script>
    <script src="/js/responsive.js?v=1"></script>

    <!-- Browser RAG Implementation -->
    <script src="/js/browser-rag/indexed-db-vector-store.js?v=1"></script>
    <script src="/js/browser-rag/browser-retriever.js?v=1"></script>
    <script src="/js/browser-rag/script-rag.js?v=1"></script>



</body>

</html>
