<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat UCY — LLM Meta Search</title>

    <!-- Theme: apply before paint -->
    <script>
      (function () {
        var t = localStorage.getItem('chatucy-theme');
        document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : 'light';
      })();
    </script>

    <!-- Design System -->
    <link href="../css/design-system.css" rel="stylesheet">

    <!-- Tailwind CSS - Local compiled version -->
    <link href="../dist/output.css" rel="stylesheet">
    
    <!-- Alpine.js from CDN for Electron compatibility -->
    <!-- Component registration happens BEFORE Alpine starts -->
    <script type="module">
        import Alpine from "../vendor/alpine/alpine.esm.js";
        import chatAppComponent from '../js/alpine-components/llmms-chat-app.js';
        
        window.Alpine = Alpine;
        Alpine.data('chatApp', chatAppComponent);
        Alpine.start();
    </script>
    
    <!-- Font Awesome for icons -->
    <link href="../vendor/fontawesome/css/all.min.css" rel="stylesheet">

    <!-- Marked.js for Markdown parsing -->
    <script src="../vendor/marked/marked.umd.js"></script>
    
    <!-- Custom minimal CSS -->
    <style>
        /* Smooth scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(106, 66, 194, 0.3);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(106, 66, 194, 0.5);
        }
        
        /* Hide scrollbar but keep functionality */
        .scrollbar-hidden::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hidden {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }

        .md-content { font-size: 0.875rem; line-height: 1.7; color: inherit; }
        .md-content p { margin: 0 0 0.65em; }
        .md-content p:last-child { margin-bottom: 0; }
        .md-content ul, .md-content ol { margin: 0.4em 0 0.7em 1.2em; }
        .md-content pre {
            background: rgba(106,66,194,0.07);
            border-radius: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            margin: 0.6em 0;
            border: 1px solid rgba(106,66,194,0.15);
        }
        .md-content code {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.82em;
            background: rgba(106,66,194,0.08);
            color: var(--accent);
            padding: 0.15em 0.4em;
            border-radius: 4px;
        }
        .md-content pre code { background: none; padding: 0; }
        .md-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
        .md-content--user code { background: rgba(255,255,255,0.18); color: #fff; }
        .md-content--user a { color: rgba(255,255,255,0.9); }
    </style>
</head>

<body class="h-screen overflow-hidden bg-white font-sans antialiased" x-data="chatApp()">
    <!-- Mobile Overlay -->
    <div 
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        x-transition:enter="transition ease-out duration-200"
        x-transition:leave="transition ease-in duration-200"
        class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden">
    </div>
    
    <!-- Main Container -->
    <div class="flex h-full">
        <!-- Sidebar -->
        <aside 
            :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
            class="fixed lg:static inset-y-0 left-0 z-40 w-72 lg:w-64 bg-primary-pale border-r border-sidebar-border transform transition-transform duration-300 ease-in-out flex flex-col">
            
            <!-- Sidebar Header with Close Button on Mobile -->
            <div class="p-4 border-b border-sidebar-border flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-800">Sessions</h2>
                <button 
                    @click="sidebarOpen = false"
                    class="lg:hidden text-primary hover:bg-primary-light rounded-lg p-2 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <!-- Session List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                <template x-for="session in sessions" :key="session.id">
                    <button 
                        @click="selectSession(session.id)"
                        :class="currentSession === session.id ? 'bg-primary text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
                        class="w-full text-left px-4 py-3 rounded-lg shadow-sm transition-all duration-200">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium truncate" x-text="session.name"></span>
                            <i class="fas fa-comment-dots text-xs opacity-60"></i>
                        </div>
                    </button>
                </template>
                
                <!-- Empty state -->
                <div x-show="sessions.length === 0" class="text-center py-8 text-gray-500">
                    <i class="fas fa-comments text-3xl mb-2"></i>
                    <p class="text-sm">No sessions yet</p>
                </div>
            </div>
            
            <!-- Sidebar Footer -->
            <div class="p-3 border-t border-sidebar-border space-y-2">
                <button 
                    @click="newChat()"
                    class="w-full bg-gray-800 hover:bg-gray-900 text-white px-4 py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span>New Chat</span>
                </button>
                <button 
                    @click="clearAllSessions()"
                    class="w-full bg-transparent hover:bg-gray-100 text-gray-700 border border-gray-300 px-4 py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-trash"></i>
                    <span>Clear All</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full relative">
            <!-- Header -->
            <header class="ds-app-header">
                <div class="ds-app-header-inner">
                    <!-- Left: sidebar toggle -->
                    <button
                        @click="sidebarOpen = !sidebarOpen"
                        class="ds-icon-btn"
                        title="Toggle sidebar">
                        <i class="fas fa-bars"></i>
                    </button>

                    <!-- Center: Title -->
                    <span class="ds-app-header-title">LLM Meta Search</span>

                    <!-- Right: nav + logos + menu -->
                    <div style="display:flex; align-items:center; gap:var(--space-3);">
                        <nav class="ds-app-nav">
                            <a href="/" class="ds-link">Home</a>
                            <a href="/chat.html" class="ds-link">Chat</a>
                            <a href="/privacy.html" class="ds-link">Privacy</a>
                        </nav>

                        <a href="https://www.ucy.ac.cy/" target="_blank" style="height:28px;" title="UCY">
                            <img src="/img/ucy_logo.png" alt="UCY" style="height:100%; object-fit:contain;" onerror="this.parentElement.style.display='none'">
                        </a>
                        <a href="https://dmsl.cs.ucy.ac.cy" target="_blank" style="height:28px;" title="DMSL">
                            <img src="/img/dmsllogobig.png" alt="DMSL" style="height:100%; object-fit:contain;" onerror="this.parentElement.style.display='none'">
                        </a>

                        <!-- Theme toggle (compact) -->
                        <div class="ds-theme-toggle">
                            <div class="ds-theme-toggle-buttons">
                                <button type="button" data-theme-toggle="light" title="Light mode">&#9788;</button>
                                <button type="button" data-theme-toggle="dark" title="Dark mode">&#9790;</button>
                            </div>
                        </div>

                        <!-- Navigation Dropdown -->
                        <div class="relative" x-data="{ open: false }">
                            <button
                                @click="open = !open"
                                class="ds-icon-btn"
                                title="Menu">
                                <img src="/img/chatucy_logo.png" alt="Menu" style="height:18px; object-fit:contain;" onerror="this.style.display='none'">
                            </button>
                            <div
                                x-show="open"
                                @click.away="open = false"
                                x-transition
                                class="ds-dropdown-menu"
                                style="position:absolute; right:0; top:calc(100% + 8px); z-index:200;">
                                <div class="ds-dropdown-version">v1.2</div>
                                <a href="/"><i class="fas fa-home" style="width:14px;"></i> Home</a>
                                <a href="/privacy.html"><i class="fas fa-lock" style="width:14px;"></i> Privacy</a>
                                <a href="/terms.html"><i class="fas fa-file-alt" style="width:14px;"></i> Terms</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Chat Area -->
            <div class="flex-1 overflow-y-auto scrollbar-hidden px-4 pt-12 pb-6 md:pt-16" id="chat-history">
                <div class="max-w-4xl mx-auto space-y-6 mt-4" style="padding-bottom: 300px;">
                    <template x-for="message in messages" :key="message.id">
                        <div 
                            :class="message.role === 'user' ? 'justify-end' : 'justify-start'"
                            class="flex">
                            <div 
                                :class="message.role === 'user' 
                                    ? 'bg-primary text-white rounded-tl-2xl rounded-tr-2xl rounded-bl-2xl' 
                                    : 'bg-gray-100 text-gray-800 rounded-tl-2xl rounded-tr-2xl rounded-br-2xl'"
                                class="max-w-[80%] px-4 py-3 shadow-sm">
                                <div class="text-sm whitespace-pre-wrap" x-html="message.content"></div>
                                <template x-if="message.model">
                                    <div class="text-xs opacity-70 mt-2" x-text="'Model: ' + message.model"></div>
                                </template>
                            </div>
                        </div>
                    </template>
                    
                    <!-- Loading indicator -->
                    <div x-show="isLoading" class="flex justify-start">
                        <div class="bg-gray-100 rounded-2xl px-4 py-3 shadow-sm">
                            <div class="flex gap-1">
                                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="absolute bottom-0 left-0 right-0 bg-primary-pale border-t border-sidebar-border p-4 shadow-lg backdrop-blur-sm">
                <div class="max-w-4xl mx-auto">
                    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-3">
                        <!-- Main Input Row -->
                        <div class="flex gap-2 items-end">
                            <textarea 
                                x-model="userInput"
                                @keydown.enter.prevent="handleEnter($event)"
                                placeholder="Type your message here..."
                                rows="1"
                                class="flex-1 resize-none border-none outline-none text-gray-800 text-sm max-h-32 overflow-y-auto scrollbar-hidden"
                                style="min-height: 2.5rem;"></textarea>
                            
                            <button 
                                @click="sendMessage()"
                                :disabled="!userInput.trim() || isLoading"
                                :class="userInput.trim() && !isLoading ? 'bg-primary hover:bg-primary-dark' : 'bg-gray-300 cursor-not-allowed'"
                                class="w-10 h-10 rounded-full text-white flex items-center justify-center transition-colors flex-shrink-0">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        
                        <!-- Bottom Controls -->
                        <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-200">
                            <!-- Model Selector -->
                            <div class="relative" x-data="{ open: false }">
                                <button 
                                    @click="open = !open"
                                    class="px-3 py-2 text-sm rounded-lg border border-primary text-primary hover:bg-primary-pale transition-colors flex items-center gap-2">
                                    <span x-text="selectedModel"></span>
                                    <i class="fas fa-chevron-down text-xs"></i>
                                </button>
                                <div 
                                    x-show="open"
                                    @click.away="open = false"
                                    x-transition
                                    class="absolute bottom-full mb-2 left-0 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50 min-w-[200px]">
                                    <div class="px-3 py-1 text-xs font-semibold text-gray-500">Meta LLM Selection</div>
                                    <button 
                                        @click="selectModel('LLM-MS-OUA'); open = false"
                                        class="w-full text-left px-3 py-2 text-sm hover:bg-gray-100 text-gray-700">
                                        LLM-MS-OUA
                                    </button>
                                    <button 
                                        @click="selectModel('LLM-MS-MAB'); open = false"
                                        class="w-full text-left px-3 py-2 text-sm hover:bg-gray-100 text-gray-700">
                                        LLM-MS-MAB
                                    </button>
                                </div>
                            </div>
                            
                            <!-- File Upload -->
                            <button 
                                @click="$refs.fileInput.click()"
                                class="w-10 h-10 rounded-lg border border-primary text-primary hover:bg-primary-pale transition-colors flex items-center justify-center">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <input type="file" x-ref="fileInput" @change="handleFileUpload($event)" class="hidden" accept=".pdf,.txt,image/*">

                            <template x-if="selectedFile">
                                <div class="px-2 py-1 rounded-lg bg-primary-pale text-primary text-xs border border-sidebar-border flex items-center gap-2 max-w-[280px]">
                                    <span class="truncate" x-text="selectedFile.name"></span>
                                    <button @click="removeSelectedFile()" class="text-primary hover:text-primary-dark">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </template>
                            
                            <div class="flex items-center gap-2 ml-auto">
                                <button 
                                    @click="settingsOpen = true"
                                    class="w-10 h-10 rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors flex items-center justify-center text-green-600 bg-green-50">
                                    <i class="fas fa-sliders"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Settings Modal -->
    <div 
        x-show="settingsOpen"
        @click.self="settingsOpen = false"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div 
            x-show="settingsOpen"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto custom-scrollbar">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h3 class="text-xl font-semibold text-gray-800">Advanced Settings</h3>
                <button @click="settingsOpen = false" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- Algorithm Type -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Algorithm Type</label>
                    <select x-model="config.algorithmType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="stepwise">OUA (Overperformers-Underperformers)</option>
                        <option value="mab">MAB (Multi-Armed Bandit)</option>
                    </select>
                </div>
                
                <!-- Token Budget -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Token Budget: <span class="text-primary font-semibold" x-text="config.maxTokens"></span>
                    </label>
                    <input 
                        type="range" 
                        x-model.number="config.maxTokens"
                        min="256" 
                        max="4096" 
                        step="128"
                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                </div>
                
                <!-- Alpha/Beta Weights -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Alpha (Question Sim): <span class="text-primary font-semibold" x-text="config.alpha.toFixed(2)"></span>
                        </label>
                        <input 
                            type="range" 
                            x-model.number="config.alpha"
                            min="0" 
                            max="1" 
                            step="0.05"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Beta (Consensus): <span class="text-primary font-semibold" x-text="config.beta.toFixed(2)"></span>
                        </label>
                        <input 
                            type="range" 
                            x-model.number="config.beta"
                            min="0" 
                            max="1" 
                            step="0.05"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dynamic Margin Coefficient</label>
                    <input
                        type="number"
                        step="0.05"
                        min="0"
                        x-model.number="config.dynamicMarginCoeff"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Start Tokens</label>
                        <input
                            type="number"
                            min="32"
                            max="4096"
                            step="32"
                            x-model.number="config.startTokens"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Max Rounds</label>
                        <input
                            type="number"
                            min="1"
                            max="100"
                            step="1"
                            x-model.number="config.maxRounds"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">MAB Explore Coefficient</label>
                    <input
                        type="number"
                        step="0.05"
                        min="0"
                        max="2"
                        x-model.number="config.xploreCoeff"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Embedding Model</label>
                    <input
                        type="text"
                        x-model.trim="config.embeddingModel"
                        placeholder="nomic-embed-text"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Model Pool (comma-separated)</label>
                    <textarea
                        x-model.trim="config.modelsText"
                        rows="2"
                        placeholder="llama3.1,mistral,qwen2.5"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent resize-none"></textarea>
                </div>
                
                <!-- Save Button -->
                <div class="pt-4 border-t border-gray-200">
                    <button 
                        @click="saveSettings(); settingsOpen = false"
                        class="w-full bg-primary hover:bg-primary-dark text-white py-3 rounded-lg font-medium transition-colors">
                        Save Settings
                    </button>
                </div>
            </div>
        </div>
    </div>
<script src="../js/ds-theme.js"></script>
</body>
</html>
