<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatUCY</title>

    <!-- Theme: apply before paint to prevent flash -->
    <script>
      (function () {
        var t = localStorage.getItem('chatucy-theme');
        document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : 'light';
      })();
    </script>

    <!-- Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="../css/design-system.css" rel="stylesheet">

    <!-- Tailwind CSS - Local compiled version -->
    <link href="../dist/output.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body style="min-height:100vh; display:flex; flex-direction:column;">

    <!-- Site Header -->
    <header class="ds-site-header">
        <div class="ds-container ds-site-header-inner">
            <a href="/" class="ds-site-logo">ChatUCY</a>

            <nav class="ds-site-nav" aria-label="Primary">
                <a href="/" class="ds-link">Home</a>
                <a href="/chat.html" class="ds-link">Chat</a>
                <a href="/llmms.html" class="ds-link">LLM-MS</a>
                <a href="/privacyllm.html" class="ds-link">Private LLM</a>
                <a href="/publications/" class="ds-link">Research</a>
            </nav>

            <div class="ds-theme-toggle" role="group" aria-label="Mode">
                <span class="ds-theme-toggle-label">Mode</span>
                <div class="ds-theme-toggle-buttons">
                    <button type="button" data-theme-toggle="light">Light</button>
                    <button type="button" data-theme-toggle="dark">Dark</button>
                </div>
            </div>

            <details class="ds-mobile-nav">
                <summary>Menu</summary>
                <nav aria-label="Mobile">
                    <a href="/" class="ds-link">Home</a>
                    <a href="/chat.html" class="ds-link">Chat</a>
                    <a href="/llmms.html" class="ds-link">LLM-MS</a>
                    <a href="/privacyllm.html" class="ds-link">Private LLM</a>
                    <a href="/publications/" class="ds-link">Research</a>
                </nav>
            </details>
        </div>
    </header>

    <!-- Main content area - can be filled by including pages -->
    <main style="flex:1;">
        <!-- Page content goes here -->
    </main>

    <!-- Footer -->
    <footer class="ds-footer">
        <div class="ds-container ds-footer-inner">
            <div>
                <span>ChatUCY — DMSL, University of Cyprus</span>
                <span style="margin-left:16px;">
                    <a href="mailto:dmsl@cs.ucy.ac.cy">dmsl@cs.ucy.ac.cy</a>
                </span>
            </div>
            <div style="display:flex; gap:24px; align-items:center;">
                <a href="/terms.html">Terms</a>
                <a href="/privacy.html">Privacy</a>
                <span>© 2025 ChatUCY</span>
            </div>
        </div>
    </footer>

    <script src="../js/ds-theme.js"></script>
</body>
</html>
